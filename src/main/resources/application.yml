spring:
  application:
    name: khatiyan

  config:
    import: optional:file:./.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 30000
      pool-name: KhatiyanDB-Pool
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        ApplicationName: khatiyan

  data:
    redis:
      host: ${VALKEY_HOST:localhost}
      port: ${VALKEY_PORT:6379}
      password: ${VALKEY_PASSWORD:}
      database: ${VALKEY_DATABASE:0}
      timeout: ${VALKEY_TIMEOUT:2s}
      connect-timeout: ${VALKEY_CONNECT_TIMEOUT:2s}
      repositories:
        enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
      - classpath:db/migration/shared
      - classpath:db/migration/intelligence
      - classpath:db/migration/auth
      - classpath:db/migration/property
      - classpath:db/migration/staff
      - classpath:db/migration/tenancy
      - classpath:db/migration/concern
      - classpath:db/migration/notice
      - classpath:db/migration/discovery
      - classpath:db/migration/notification
      - classpath:db/migration/payment
      - classpath:db/migration/billing
      - classpath:db/migration/reminder
      - classpath:db/migration/expense
      - classpath:db/migration/compliance
      - classpath:db/migration/dashboard
      - classpath:db/migration/nudge
      - classpath:db/migration/enquiry
      - classpath:db/migration/chat
      - classpath:db/migration/servicebalance
      - classpath:db/migration/verification
      - classpath:db/migration/food

  modulith:
    events:
      # Completed publications are deleted so the registry table stays lean;
      # incomplete ones (crash between commit and listener) are re-run on the
      # next startup — listeners must therefore be idempotent (at-least-once).
      completion-mode: delete
      republish-outstanding-events-on-restart: true

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          # Fail fast when the SMTP host is unreachable (e.g. outbound SMTP blocked
          # by the network) instead of hanging the request on the OS TCP timeout.
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${SMTP_READ_TIMEOUT_MS:5000}
          writetimeout: ${SMTP_WRITE_TIMEOUT_MS:5000}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:false}
  jackson:
    # ALWAYS, deliberately. With non_null every null field was dropped from the
    # response, so a field the client types as `T | null` arrived as `undefined`
    # instead — `x === null` never matched and reads like `x.length` blew up on
    # whichever record happened to have a null. Data-dependent, so it surfaced as
    # rare unreproducible TypeErrors. Sending null makes the wire match the
    # declared contract. Costs a few bytes per response.
    # NOTE: TenancyAgreementService pins its own NON_NULL mapper for the
    # agreement content hash, which must not move when this changes.
    default-property-inclusion: always
    # Dates as ISO-8601 strings, never epoch numbers. Jackson 3 moved this out
    # of SerializationFeature into DateTimeFeature, so Boot 4 reads it from
    # spring.jackson.datatype.datetime — under the old key the context refused
    # to start with "No enum constant SerializationFeature
    # .write-dates-as-timestamps". Stated rather than left to Jackson 3's
    # default, because the frontend parses every date as a string.
    datatype:
      datetime:
        write-dates-as-timestamps: false
    serialization:
      indent-output: false

  autoconfigure:
    exclude:
      # Every Spring AI OpenAI auto-configuration, off.
      #
      # The starter is here because Groq and Workers AI both speak the OpenAI
      # wire format, not because we use OpenAI. Left alone it builds six models
      # pointed at api.openai.com from spring.ai.openai.*, and an
      # auto-configured chat model is one an @Autowired ChatModel could pick up
      # by accident and quietly send a tenant's words to a provider we never
      # chose. The intelligence module builds its models explicitly, each with
      # its own base URL, key and retry policy (AI spec §8.3).
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

  ai:
    # Spring AI's own observation logging. Prompts and completions must never
    # reach the application log: they carry whatever a tenant typed.
    chat:
      observations:
        log-prompt: false
        log-completion: false

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized

resilience4j:
  circuitbreaker:
    instances:
      razorpay:
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${RAZORPAY_CIRCUIT_BREAKER_WINDOW_SIZE:10}
        minimum-number-of-calls: ${RAZORPAY_CIRCUIT_BREAKER_MIN_CALLS:5}
        failure-rate-threshold: ${RAZORPAY_CIRCUIT_BREAKER_FAILURE_RATE:50}
        wait-duration-in-open-state: ${RAZORPAY_CIRCUIT_BREAKER_OPEN_WAIT:30s}
        permitted-number-of-calls-in-half-open-state: ${RAZORPAY_CIRCUIT_BREAKER_HALF_OPEN_CALLS:2}
        automatic-transition-from-open-to-half-open-enabled: true

app:
  ai:
    # The master switch. Off means off: no provider call, no key read, nothing
    # in the background. This is the only module that sends data outside
    # Khatiyan, so doing nothing is the resting state, not a misconfiguration.
    enabled: ${AI_ENABLED:false}
    smart-search:
      enabled: ${AI_SMART_SEARCH_ENABLED:false}
      max-query-chars: 300
      timeout: 8s
      user-limit-per-minute: 6
      user-limit-per-day: 40
      # Our own allowances. Switched off in application-dev.yml so testing is
      # not throttled; Groq's limits apply regardless.
      enforce-limits: ${AI_ENFORCE_LIMITS:true}
      cache-ttl: 24h
      # A repeat of the same search inside this window returns the identical
      # answer with no model call. Case, spacing and punctuation are ignored.
      answer-ttl: 15m
    providers:
      groq:
        base-url: https://api.groq.com/openai/v1
        api-key: ${GROQ_API_KEY:}
        # Rotation slot. A second key REPLACES the first — it never runs
        # alongside it to widen the quota. Groq's free limits are per
        # organisation, so pooling keys buys nothing and risks the account.
        next-api-key: ${GROQ_API_KEY_NEXT:}
        # Flip only once Zero Data Retention is actually enabled on the
        # account. Until then assume prompts are kept up to 30 days for abuse
        # monitoring, and send nothing that would matter if they were.
        zero-data-retention-confirmed: ${GROQ_ZDR_CONFIRMED:false}
        # low | medium | high. Measured 2026-09-13: at low an interpret call is
        # ~1,900 tokens with no quality loss on the test set, and medium returned
        # empty completions (reasoning used the whole output) on the same query.
        reasoning-effort: ${GROQ_REASONING_EFFORT:low}
        models:
          structured-fast: openai/gpt-oss-20b
          structured-strong: openai/gpt-oss-120b
        # Ninety per cent of the published free ceilings, so we refuse
        # ourselves before Groq refuses us. Our refusal is a message we write.
        budget:
          requests-per-minute: 27
          requests-per-day: 900
          tokens-per-minute: 7200
          tokens-per-day: 180000
      workers-ai:
        base-url: ${CLOUDFLARE_AI_BASE_URL:}
        api-key: ${CLOUDFLARE_AI_API_TOKEN:}
        next-api-key: ${CLOUDFLARE_AI_API_TOKEN_NEXT:}
        models:
          # Chosen in the Milestone 1 spike, against the golden set.
          structured-fast: ""
          structured-strong: "@cf/openai/gpt-oss-120b"
        neurons-per-day: 9000

  logging:
    dir: ${KHATIYAN_LOG_DIR:logs}
  # Signed direct upload: the device sends bytes straight to Cloudinary and only
  # the signature is minted here, so image traffic never occupies a request
  # thread. The secret signs and is never sent to the client.
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    # How long a minted signature stays usable. Long enough for a slow upload to
    # start, short enough that a leaked one is worthless by the time it is found.
    signature-ttl-seconds: ${CLOUDINARY_SIGNATURE_TTL_SECONDS:600}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-minutes: ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:60}

  auth:
    # Concurrent signed-in devices per account. Checked AFTER credentials are
    # proven, so refusing here cannot reveal whether a number is registered.
    max-active-sessions: ${AUTH_MAX_ACTIVE_SESSIONS:4}
    login-rate-limit:
      phone-limit-attempts: ${LOGIN_PHONE_LIMIT_ATTEMPTS:20}
      phone-limit-duration-minutes: ${LOGIN_PHONE_LIMIT_DURATION_MINUTES:15}
      ip-limit-attempts: ${LOGIN_IP_LIMIT_ATTEMPTS:100}
      ip-limit-duration-minutes: ${LOGIN_IP_LIMIT_DURATION_MINUTES:15}
      permanent-lock-failed-attempts: ${LOGIN_PERMANENT_LOCK_FAILED_ATTEMPTS:100}
  rate-limit:
    enabled: ${API_RATE_LIMIT_ENABLED:true}
    fail-open: ${API_RATE_LIMIT_FAIL_OPEN:true}
    default-rule:
      attempts: ${API_RATE_LIMIT_DEFAULT_ATTEMPTS:300}
      duration-seconds: ${API_RATE_LIMIT_DEFAULT_DURATION_SECONDS:60}
    routes:
      - method: POST
        path-prefix: /api/v1/auth/login
        attempts: ${API_RATE_LIMIT_LOGIN_IP_ATTEMPTS:100}
        duration-seconds: ${API_RATE_LIMIT_LOGIN_IP_DURATION_SECONDS:900}
        identity: IP
      - method: POST
        path-prefix: /api/v1/auth/otp
        attempts: ${API_RATE_LIMIT_OTP_IP_ATTEMPTS:30}
        duration-seconds: ${API_RATE_LIMIT_OTP_IP_DURATION_SECONDS:3600}
        identity: IP
      - method: POST
        path-prefix: /api/v1/payments
        attempts: ${API_RATE_LIMIT_PAYMENT_ATTEMPTS:30}
        duration-seconds: ${API_RATE_LIMIT_PAYMENT_DURATION_SECONDS:600}
        identity: USER_OR_IP
      - method: POST
        path-prefix: /api/v1/concerns
        attempts: ${API_RATE_LIMIT_CONCERN_ATTEMPTS:20}
        duration-seconds: ${API_RATE_LIMIT_CONCERN_DURATION_SECONDS:86400}
        identity: USER_OR_IP
      - method: POST
        path-prefix: /api/v1/notifications/device-tokens
        attempts: ${API_RATE_LIMIT_DEVICE_TOKEN_ATTEMPTS:20}
        duration-seconds: ${API_RATE_LIMIT_DEVICE_TOKEN_DURATION_SECONDS:3600}
        identity: USER_OR_IP
  firebase:
    enabled: ${FIREBASE_AUTH_ENABLED:false}
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
    service-account-json-base64: ${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64:}
  otp:
    delivery:
      sms:
        provider: ${OTP_SMS_PROVIDER:log}
        url: ${OTP_SMS_URL:}
        auth-header: ${OTP_SMS_AUTH_HEADER:authkey}
        auth-value: ${OTP_SMS_AUTH_VALUE:}
        sender-id: ${OTP_SMS_SENDER_ID:}
        template-id: ${OTP_SMS_TEMPLATE_ID:}
        otp-variable-name: ${OTP_SMS_OTP_VARIABLE_NAME:OTP}
      whatsapp:
        provider: ${OTP_WHATSAPP_PROVIDER:log}
        url: ${OTP_WHATSAPP_URL:}
        auth-header: ${OTP_WHATSAPP_AUTH_HEADER:Authorization}
        auth-value: ${OTP_WHATSAPP_AUTH_VALUE:}
        sender-id: ${OTP_WHATSAPP_SENDER_ID:}
        template-id: ${OTP_WHATSAPP_TEMPLATE_ID:}
      email:
        provider: ${OTP_EMAIL_PROVIDER:log}
        from: ${OTP_EMAIL_FROM:no-reply@khatiyan.local}
        subject-prefix: ${OTP_EMAIL_SUBJECT_PREFIX:Khatiyan}
  email:
    verification-url: ${EMAIL_VERIFICATION_URL:http://localhost:8080/api/v1/auth/email/verify}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,http://localhost:8082}
  geo:
    # log = keyless dev fallback (empty results); mappls = live geocoding.
    provider: ${GEO_PROVIDER:log}
    # Named landmarks for smart search ("near Sister Nivedita University") go
    # through this chain in order, skipping any vendor with no credentials.
    # Mappls leads because its coverage of Indian institutions is far better
    # than OpenStreetMap's; Geoapify is the fallback and, until Mappls keys are
    # set, the only lookup. Ordinary autocomplete stays on `provider`.
    landmark-lookup: ${GEO_LANDMARK_LOOKUP:mappls,geoapify}
    search-rate-per-minute: ${GEO_SEARCH_RATE_PER_MINUTE:60}
    # Panning the picker fires a reverse lookup per settle; keep headroom.
    reverse-rate-per-minute: ${GEO_REVERSE_RATE_PER_MINUTE:60}
    cache:
      search-ttl-hours: ${GEO_SEARCH_CACHE_TTL_HOURS:24}
      reverse-ttl-hours: ${GEO_REVERSE_CACHE_TTL_HOURS:168}
    backfill:
      batch-size: ${GEO_BACKFILL_BATCH_SIZE:20}
      property-cron: ${GEO_BACKFILL_PROPERTY_CRON:0 5 1 * * *}
      local-place-cron: ${GEO_BACKFILL_LOCAL_PLACE_CRON:0 15 1 * * *}
      zone: ${GEO_BACKFILL_ZONE:Asia/Kolkata}
    mappls:
      # Static-key APIs: the key goes on every request as access_token. It must
      # be a cloud-type key (IP-whitelisted) — a mobile app's key is locked to
      # the app and refuses server calls. Used only by smart search today.
      autosuggest-url: ${MAPPLS_AUTOSUGGEST_URL:https://search.mappls.com/search/places/autosuggest/json}
      nearby-url: ${MAPPLS_NEARBY_URL:https://search.mappls.com/search/places/nearby/json}
      # %s is replaced with the REST key (Mappls carries it in the URL path).
      reverse-url: ${MAPPLS_REVERSE_URL:https://apis.mappls.com/advancedmaps/v1/%s/rev_geocode}
      rest-key: ${MAPPLS_REST_KEY:}
    geoapify:
      base-url: ${GEOAPIFY_BASE_URL:https://api.geoapify.com/v1/geocode}
      api-key: ${GEOAPIFY_API_KEY:}
      country-filter: ${GEOAPIFY_COUNTRY_FILTER:countrycode:in}
  enquiry:
    expiry-cron: ${ENQUIRY_EXPIRY_CRON:0 20 * * * *}
    expiry-zone: ${ENQUIRY_EXPIRY_ZONE:Asia/Kolkata}
  notice:
    recurring-generation-cron: ${NOTICE_RECURRING_GENERATION_CRON:0 */5 * * * *}
    recurring-generation-zone: ${NOTICE_RECURRING_GENERATION_ZONE:Asia/Kolkata}
    archive-expired-cron: ${NOTICE_ARCHIVE_EXPIRED_CRON:0 45 0 * * *}
    archive-expired-zone: ${NOTICE_ARCHIVE_EXPIRED_ZONE:Asia/Kolkata}
  concern:
    update-escalations-cron: ${CONCERN_UPDATE_ESCALATIONS_CRON:0 30 0 * * *}
    update-escalations-zone: ${CONCERN_UPDATE_ESCALATIONS_ZONE:Asia/Kolkata}
    close-expired-resolved-cron: ${CONCERN_CLOSE_EXPIRED_RESOLVED_CRON:0 35 0 * * *}
    close-expired-resolved-zone: ${CONCERN_CLOSE_EXPIRED_RESOLVED_ZONE:Asia/Kolkata}
  tenancy:
    room-change-execution-cron: ${TENANCY_ROOM_CHANGE_EXECUTION_CRON:0 12 0 * * *}
    room-change-execution-zone: ${TENANCY_ROOM_CHANGE_EXECUTION_ZONE:Asia/Kolkata}
    room-change-execution-batch-size: ${TENANCY_ROOM_CHANGE_EXECUTION_BATCH_SIZE:50}
  security:
    # Addresses of proxies WE put in front of the app. X-Forwarded-For is
    # honoured only when the immediate peer is one of these; with the list empty
    # the header is ignored and the socket address is used, which is the only
    # truthful answer for a directly exposed app.
    #
    # Set this the moment a load balancer goes in front, or every recorded
    # address becomes the balancer's own.
    trusted-proxies: ${TRUSTED_PROXIES:}

  billing:
    monthly-cycle-generation-cron: ${BILLING_MONTHLY_CYCLE_GENERATION_CRON:0 15 0 * * *}
    monthly-cycle-generation-zone: ${BILLING_MONTHLY_CYCLE_GENERATION_ZONE:Asia/Kolkata}
    monthly-cycle-generation-batch-size: ${BILLING_MONTHLY_CYCLE_GENERATION_BATCH_SIZE:50}
    # Opens cycles whose period has started. Creation already opens same-day
    # cycles, so this now catches future-dated starts and anything missed.
    cycle-activation-cron: ${BILLING_CYCLE_ACTIVATION_CRON:0 18 0 * * *}
    cycle-activation-zone: ${BILLING_CYCLE_ACTIVATION_ZONE:Asia/Kolkata}
    overdue-marker-cron: ${BILLING_OVERDUE_MARKER_CRON:0 20 0 * * *}
    overdue-marker-zone: ${BILLING_OVERDUE_MARKER_ZONE:Asia/Kolkata}
    late-fee-recalculation-cron: ${BILLING_LATE_FEE_RECALCULATION_CRON:0 25 0 * * *}
    late-fee-recalculation-zone: ${BILLING_LATE_FEE_RECALCULATION_ZONE:Asia/Kolkata}
    monthly-report-generation-cron: ${BILLING_MONTHLY_REPORT_GENERATION_CRON:0 44 0 * * *}
    monthly-report-generation-zone: ${BILLING_MONTHLY_REPORT_GENERATION_ZONE:Asia/Kolkata}
  dashboard:
    upcoming-exit-days: ${DASHBOARD_UPCOMING_EXIT_DAYS:7}
  payment:
    default-provider: ${PAYMENT_DEFAULT_PROVIDER:RAZORPAY}
    currency: ${PAYMENT_CURRENCY:INR}
    # Bounds a single checkout attempt, not the order. The order stays reusable
    # so Razorpay can reject a duplicate payment on it; reopening checkout
    # renders a fresh countdown.
    order-expiry-minutes: ${PAYMENT_ORDER_EXPIRY_MINUTES:30}
    # Razorpay Route payout split. OFF until Route is activated on the Razorpay
    # account: with it off, the bill is a plain charge to the single configured
    # account and no owner transfer is attempted.
    route-enabled: ${PAYMENT_ROUTE_ENABLED:false}
    # Owner-borne fee, netted from the payout so the tenant always pays exactly
    # the bill. 1%, floored at Rs 5 and capped at Rs 100.
    platform-fee-bps: ${PAYMENT_PLATFORM_FEE_BPS:100}
    platform-fee-min-paise: ${PAYMENT_PLATFORM_FEE_MIN_PAISE:500}
    platform-f  e-max-paise: ${PAYMENT_PLATFORM_FEE_MAX_PAISE:10000}
    # Fallback only: the real gateway fee is read from the captured payment.
    gateway-fee-fallback-bps: ${PAYMENT_GATEWAY_FEE_FALLBACK_BPS:236}
    ifsc:
      base-url: ${PAYMENT_IFSC_BASE_URL:https://ifsc.razorpay.com}
      enabled: ${PAYMENT_IFSC_ENABLED:true}
      timeout-ms: ${PAYMENT_IFSC_TIMEOUT_MS:3000}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  verification:
    # Off until a vendor contract exists. A half-configured identity check is
    # worse than none: it takes an owner's money and then fails their tenant at
    # the last step of onboarding.
    enabled: ${VERIFICATION_ENABLED:false}
    # Named, never inferred from whichever credentials happen to be set. A
    # missing secret must fail at startup, not quietly fall back to the adapter
    # that talks to nobody — a production deployment verifying every tenant
    # against a stub is the worst failure this module has.
    provider: ${VERIFICATION_PROVIDER:DEV}
    # Stated to the provider and recorded by UIDAI. It has to be the real
    # reason: this is the sentence read back to us if anybody audits what we
    # used Aadhaar for.
    # Under 50 characters, which Decentro enforces on the FIRST call — a
    # purpose one character too long does not degrade the service, it stops
    # every check outright. Startup refuses a longer one rather than letting a
    # tenant discover it.
    purpose: ${VERIFICATION_PURPOSE:Tenant identity verification for rental agreement}
    # Salts the hash UIDAI computes over the registered mobile. Ours, not the
    # tenant's, which is what makes that hash reproducible on our side. Blank
    # means the phone check simply does not run.
    share-code: ${VERIFICATION_SHARE_CODE:}
    otp-validity-minutes: ${VERIFICATION_OTP_VALIDITY_MINUTES:10}
    # Attempts cost the OWNER money, so a tenant who can retry without limit is
    # a tenant spending somebody else's balance.
    max-attempts-per-day: ${VERIFICATION_MAX_ATTEMPTS_PER_DAY:5}
    resend-cooldown-seconds: ${VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
    # What the DEV provider says the tenant is called. Set it to the name on the
    # tenancy you are testing with and the strict match passes, instead of
    # having to name a test tenant "DEV TEST USER". Ignored by every real
    # provider.
    dev-name: ${VERIFICATION_DEV_NAME:DEV TEST USER}
    decentro:
      # Staging by default, which is the safe one. A deployment that forgot to
      # set this talks to a sandbox and fails visibly, rather than quietly
      # spending money against a real person's Aadhaar.
      base-url: ${DECENTRO_BASE_URL:https://in.staging.decentro.tech}
      client-id: ${DECENTRO_CLIENT_ID:}
      client-secret: ${DECENTRO_CLIENT_SECRET:}
      # Bounded on purpose. With no timeout we waited as long as Decentro waits
      # on UIDAI, measured at 45 seconds, with the tenant watching a spinner.
      connect-timeout: ${DECENTRO_CONNECT_TIMEOUT:5s}
      read-timeout: ${DECENTRO_READ_TIMEOUT:30s}

  service-balance:
    # Off until the gateway account and webhook are live. With it off the screen
    # still reads, so an owner sees a balance of zero rather than an error.
    enabled: ${SERVICE_BALANCE_ENABLED:false}
    currency: ${SERVICE_BALANCE_CURRENCY:INR}
    # This balance buys identity checks costing a few rupees each, so the bounds
    # are deliberately small. A large prepaid balance serves nobody and only
    # makes the refund conversation bigger.
    min-top-up-paise: ${SERVICE_BALANCE_MIN_TOP_UP_PAISE:10000}
    max-top-up-paise: ${SERVICE_BALANCE_MAX_TOP_UP_PAISE:2500000}
    quick-amounts-paise: ${SERVICE_BALANCE_QUICK_AMOUNTS_PAISE:50000,100000,250000}
    checkout-expiry-minutes: ${SERVICE_BALANCE_CHECKOUT_EXPIRY_MINUTES:30}
    # A service may run on an empty balance, so we carry the provider's bill
    # until the next top-up. Rs 250 is the ceiling on that exposure, after which
    # services stop until the dues are cleared.
    max-outstanding-paise: ${SERVICE_BALANCE_MAX_OUTSTANDING_PAISE:25000}
    # Dues plus every check ordered and not yet used, less what the owner has
    # paid in. Ordering creates no debt until a tenant runs a check, so the dues
    # ceiling above cannot see a queue of ordered work building up behind it.
    max-exposure-paise: ${SERVICE_BALANCE_MAX_EXPOSURE_PAISE:100000}
    # What each paid service costs, in paise. Configuration rather than code:
    # prices change, and a charge made last month must not start looking wrong
    # the day one does. Confirm against the provider's own rate before launch.
    prices-paise:
      AADHAAR_OKYC: ${SERVICE_PRICE_AADHAAR_OKYC_PAISE:1500}
    # Asks the gateway about checkouts that never finished. The webhook is the
    # fast path; this is what makes a lost webhook a delay instead of a loss.
    reconcile-cron: ${SERVICE_BALANCE_RECONCILE_CRON:0 */5 * * * *}
    reconcile-zone: ${SERVICE_BALANCE_RECONCILE_ZONE:Asia/Kolkata}
    expiry-cron: ${SERVICE_BALANCE_EXPIRY_CRON:0 */15 * * * *}
    expiry-zone: ${SERVICE_BALANCE_EXPIRY_ZONE:Asia/Kolkata}
    # Where the phone's browser can reach this server. Blank means "use the host
    # the app just called us on", which is the one address that phone is known
    # to resolve. Set it in production, where the domain is known and a forged
    # Host header must not decide where owners are sent to pay.
    public-base-url: ${SERVICE_BALANCE_PUBLIC_BASE_URL:}
    # The app's scheme. Redirecting here closes the in-app browser tab and
    # brings the phone's browser back to the app.
    return-url: ${SERVICE_BALANCE_RETURN_URL:khatiyan://service-balance}
    razorpay:
      # The same gateway account as the parked payment module. Khatiyan is the
      # merchant of record for a top-up because it is selling its own service,
      # so none of that module's split-settlement machinery applies here.
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  notification:
    push-delivery-cron: ${NOTIFICATION_PUSH_DELIVERY_CRON:0 */1 * * * *}
    push-delivery-zone: ${NOTIFICATION_PUSH_DELIVERY_ZONE:Asia/Kolkata}
    cleanup-cron: ${NOTIFICATION_CLEANUP_CRON:0 0 0 * * *}
    cleanup-zone: ${NOTIFICATION_CLEANUP_ZONE:Asia/Kolkata}
  reminder:
    scan-cron: ${REMINDER_SCAN_CRON:0 40 0 * * *}
    scan-zone: ${REMINDER_SCAN_ZONE:Asia/Kolkata}
    process-cron: ${REMINDER_PROCESS_CRON:0 */5 * * * *}
    process-zone: ${REMINDER_PROCESS_ZONE:Asia/Kolkata}
    processing-batch-size: ${REMINDER_PROCESSING_BATCH_SIZE:100}

logging:
  config: "classpath:logback-spring.xml"
  file:
    name: "${KHATIYAN_LOG_DIR:logs}/khatiyan-app.log"
  level:
    root: INFO
    com.khatiyan: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
